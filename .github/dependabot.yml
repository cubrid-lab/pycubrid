# Minor and patch version updates are grouped into one PR per ecosystem and
# directory, so CI runs once instead of once per package (#750). Major updates,
# security updates and the runtime dependency tzdata stay in their own PRs; the
# grouped PR still has to pass the required checks before auto-merge completes.
# The root uv entry updates pyproject.toml and uv.lock together for every group (test, lint,
# security, release, docs, mutation), including the documentation tools that
# lived in docs/requirements.txt before #784.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      dev-tools:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "tzdata"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
