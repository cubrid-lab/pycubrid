name: Integration Full Matrix

# Full Python x CUBRID compatibility validation.
# Routine CI uses representative combinations; see docs/CI_POLICY.md.
# Full verification runs only on explicit dispatch or a release workflow call.
# (workflow_dispatch), and as the release gate: publish-pypi.yml calls it through
# workflow_call with the release commit SHA, plus the cross-version behavior
# differential (#351) that needs all four CUBRID versions at once, and the
# official-driver differential (#446) against the pinned CUBRIDdb oracle, and
# the Python 3.11/3.14 offline suite, lint, type checking, the public-API check
# and the repository tooling tests at the same SHA (#750).

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA; dispatch the branch at this exact commit"
        required: true
        type: string
      pr_number:
        description: "Optional PR number; reject outdated head evidence"
        required: false
        type: string
  workflow_call:
    inputs:
      release_call:
        description: "Reusable release validation; caller event may be workflow_dispatch"
        required: false
        default: true
        type: boolean
      sha:
        description: "Full commit SHA to test (publish-pypi.yml passes the release commit)"
        required: true
        type: string

# Full verification runs only on explicit dispatch or a release workflow call.
# Manual runs replace older pending runs; release calls are isolated by SHA.
concurrency:
  group: integration-full-${{ inputs.sha && format('release-{0}', inputs.sha) || github.ref }}
  cancel-in-progress: ${{ !inputs.sha }}

jobs:
  validate-target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify requested manual commit and current PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_CALL: ${{ inputs.release_call || false }}
        with:
          script: |
            if (process.env.RELEASE_CALL === 'true' || context.eventName !== 'workflow_dispatch') return;
            const inputs = context.payload.inputs || {};
            const sha = (inputs.sha || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha) || sha !== context.sha.toLowerCase()) {
              throw new Error('Dispatch branch must point at the requested full commit SHA');
            }
            const pr = inputs.pr_number || '';
            if (pr) {
              if (!/^[1-9][0-9]*$/.test(pr) || !Number.isSafeInteger(Number(pr))) {
                throw new Error('PR number must be a positive integer');
              }
              const {data} = await github.rest.pulls.get({...context.repo, pull_number: Number(pr)});
              const repo = `${context.repo.owner}/${context.repo.repo}`;
              if (data.base.repo.full_name !== repo || data.state !== 'open' || data.head.sha.toLowerCase() !== sha) {
                throw new Error('Requested commit is no longer the current open PR head');
              }
            }
            await core.summary.addRaw(`Validated commit: ${sha}; PR: ${pr || 'none'}`).write();

  integration-full:
    needs: validate-target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        cubrid-version: ["10.2", "11.0", "11.2", "11.4"]
    services:
      cubrid:
        image: cubrid/cubrid:${{ matrix.cubrid-version }}
        env:
          CUBRID_DB: testdb
        ports:
          - 33000:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install pycubrid
        run: |
          uv pip install --system -e ".[dev]"
          uv pip freeze --system
      - name: Wait for CUBRID readiness
        run: python scripts/wait_for_cubrid.py
      - name: Run integration tests
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
          # Broker-control regressions (#485) run broker_changer/broker reset here.
          CUBRID_TEST_DOCKER_CONTAINER: ${{ job.services.cubrid.id }}
        run: |
          python scripts/check_integration_lanes.py
          python -m pytest tests/ -m "integration and not slow and not tls" -v --tb=short \
            --junitxml=normal-results.xml
          python scripts/check_integration_lanes.py --results normal-results.xml

  integration-tls:
    needs: validate-target
    # Provision a CUBRID broker with SSL=ON so tests/test_aio_ssl_integration.py
    # is exercised in CI instead of silently skipping (closes #147).  Uses a
    # manually-managed container rather than a service so we can flip the
    # broker config and extract the self-signed certificate before the
    # tests run.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        cubrid-version: ["11.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install pycubrid
        run: |
          uv pip install --system -e ".[dev]"
          uv pip freeze --system
      - name: Start CUBRID broker with SSL=ON
        run: |
          set -euxo pipefail
          # Generate a self-signed cert valid for `localhost` (the test host)
          # so that the test fixture's verified SSLContext accepts the broker
          # without disabling hostname checks.  The default cert shipped in
          # the cubrid image has CN=www.cubrid.org and would fail hostname
          # verification, causing every TLS test to silently skip.
          mkdir -p "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/tls/cas_ssl_cert.key" \
            -out "$RUNNER_TEMP/tls/cas_ssl_cert.crt" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost"
          chmod 600 "$RUNNER_TEMP/tls/cas_ssl_cert.key"

          docker run -d --rm --name cubrid-tls \
            -e CUBRID_DB=testdb \
            -p 33000:33000 \
            -p 30000:30000 \
            cubrid/cubrid:${{ matrix.cubrid-version }}
          # Wait for the default broker to come up before reconfiguring it.
          for i in $(seq 1 40); do
            if docker exec --user cubrid cubrid-tls bash -lc "cubrid broker status | grep -q '^% broker1'"; then
              echo "BROKER1 reachable"
              break
            fi
            echo "Waiting for BROKER1... (attempt $i/40)"
            sleep 3
          done
          # Replace the default broker cert with our localhost-valid cert
          # so the Python test fixture can verify the connection cleanly.
          docker cp "$RUNNER_TEMP/tls/cas_ssl_cert.crt" cubrid-tls:/home/cubrid/CUBRID/conf/cas_ssl_cert.crt
          docker cp "$RUNNER_TEMP/tls/cas_ssl_cert.key" cubrid-tls:/home/cubrid/CUBRID/conf/cas_ssl_cert.key
          docker exec cubrid-tls bash -lc "chown cubrid:cubrid /home/cubrid/CUBRID/conf/cas_ssl_cert.* && chmod 600 /home/cubrid/CUBRID/conf/cas_ssl_cert.key"
          # Flip SSL=OFF -> SSL=ON for BROKER1 and restart the broker so
          # the CAS workers reload the new TLS setting and the new cert.
          docker exec --user cubrid cubrid-tls bash -lc "
            set -eux
            conf=\$CUBRID/conf/cubrid_broker.conf
            sed -i '/^\[%BROKER1\]/,/^\[/ s/^\s*SSL\s*=\s*OFF/SSL=ON/' \$conf
            grep -A2 '^\[%BROKER1\]' \$conf | head -20
            # A one-shot 'broker restart' can fail to stop broker1 (Cannot
            # inactivate broker), leave the non-TLS broker running and abort
            # the lane (#767). Stop with bounded retries until broker1 is gone,
            # then start it and verify it is up.
            for i in \$(seq 1 10); do
              cubrid broker stop || true
              # Accept absence only on CUBRID's explicit stopped message, not on a
              # status command that failed and printed nothing.
              if cubrid broker status 2>&1 | grep -q 'cubrid broker is not running'; then
                echo 'broker stopped'; break
              fi
              echo \"broker still running, retrying stop (attempt \$i/10)\"
              sleep 3
            done
            if ! cubrid broker status 2>&1 | grep -q 'cubrid broker is not running'; then
              echo '::error::broker1 did not stop; SSL=ON was not applied'
              exit 1
            fi
            cubrid broker start
            cubrid broker status | grep -q '^% broker1' || {
              echo '::error::broker1 failed to start under SSL=ON'
              exit 1
            }
            # Start the database and fail loudly if it never comes up. The old
            # 'start testdb || start cubdb || true' hid a provisioning race
            # (#330): a failed start became exit 0 and the symptom surfaced two
            # minutes later in the readiness probe. Retry the real DB and verify
            # it is actually running.
            for i in \$(seq 1 30); do
              if cubrid server status testdb 2>/dev/null | grep -q 'Server testdb'; then
                echo 'testdb server is up'; break
              fi
              cubrid server start testdb || true
              sleep 3
            done
            cubrid server status testdb | grep -q 'Server testdb' || {
              echo '::error::testdb server failed to start under SSL=ON'
              cubrid server status || true
              exit 1
            }
          "
          cp "$RUNNER_TEMP/tls/cas_ssl_cert.crt" "$RUNNER_TEMP/cas_ssl_cert.crt"
          ls -l "$RUNNER_TEMP/cas_ssl_cert.crt"
      - name: Probe TLS broker readiness
        env:
          CUBRID_TLS_TEST_CA_FILE: ${{ runner.temp }}/cas_ssl_cert.crt
        run: |
          set -euxo pipefail
          # Probe the broker with a real TLS handshake.  Fail loudly if the
          # broker is not actually serving TLS — this is the whole point
          # of the job, so a silent skip would defeat the purpose.
          for i in $(seq 1 30); do
            if python - <<'PY'
          import os, ssl, sys
          import pycubrid
          # Use a verified default context against the CA file generated by
          # the previous step.  If the broker is serving a cert that does not
          # validate against this CA (or has the wrong CN/SAN), the probe must
          # fail loudly — silently accepting any TLS endpoint on :33000 would
          # defeat the purpose of the integration-tls job (issue #157).
          ctx = ssl.create_default_context(cafile=os.environ["CUBRID_TLS_TEST_CA_FILE"])
          try:
              conn = pycubrid.connect(
                  host="localhost", port=33000,
                  database="testdb", user="dba", password="",
                  ssl=ctx, connect_timeout=5,
              )
              cur = conn.cursor(); cur.execute("SELECT 1"); cur.fetchone(); cur.close(); conn.close()
              print("TLS broker ready")
              sys.exit(0)
          except Exception as exc:
              print(f"Not ready yet: {exc}")
              sys.exit(1)
          PY
            then
              break
            fi
            echo "Waiting for TLS broker... (attempt $i/30)"
            sleep 3
          done
          # Final mandatory check — if this fails, the job must fail.
          python - <<'PY'
          import os, ssl, pycubrid
          ctx = ssl.create_default_context(cafile=os.environ["CUBRID_TLS_TEST_CA_FILE"])
          conn = pycubrid.connect(host="localhost", port=33000, database="testdb",
                                   user="dba", password="", ssl=ctx)
          conn.close()
          print("Final TLS probe OK")
          PY
      - name: Run async TLS integration tests
        timeout-minutes: 5
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
          CUBRID_TEST_HOST: localhost
          CUBRID_TEST_PORT: "33000"
          CUBRID_TEST_DB: testdb
          CUBRID_TEST_USER: dba
          CUBRID_TEST_PASSWORD: ""
          CUBRID_TLS_TEST_HOST: localhost
          CUBRID_TLS_TEST_PORT: "33000"
          CUBRID_TLS_TEST_DB: testdb
          CUBRID_TLS_TEST_USER: dba
          CUBRID_TLS_TEST_PASSWORD: ""
          CUBRID_TLS_TEST_CA_FILE: ${{ runner.temp }}/cas_ssl_cert.crt
          CUBRID_TLS_TEST_MISMATCH_HOST: "127.0.0.1"
          # Stock SSL=OFF query_editor broker on the same server: TLS-to-plaintext
          # refusal coverage in tests/test_tls_matrix_integration.py (#350).
          CUBRID_TLS_TEST_PLAIN_PORT: "30000"
          # Trust the self-signed broker cert via Python's default SSL context
          # (used by `ssl=True`) so the default-context test runs instead of
          # being silently skipped.
          SSL_CERT_FILE: ${{ runner.temp }}/cas_ssl_cert.crt
        run: |
          set -euxo pipefail
          # `-p no:cacheprovider` keeps the run isolated from prior caches
          # in container layers.  We assert that broker-provisioning skips
          # cannot pass silently: every selected test must run. The driver's
          # TLS preflight now handles Python 3.10 verification failures too.
          python -m pytest tests/ -m "integration and tls" -v --tb=short \
            -o addopts="" -p no:cacheprovider \
            --junitxml=tls-results.xml \
            --no-header --no-summary -rN 2>&1 | tee tls-run.log
          python scripts/check_integration_lanes.py --results tls-results.xml
      - name: Capture TLS broker logs on failure
        if: failure()
        run: docker logs cubrid-tls || true
      - name: Stop CUBRID TLS broker
        if: always()
        run: docker stop cubrid-tls || true

  integration-charset:
    needs: validate-target
    # EUC-KR database lane (#86): the same CUBRID image with
    # CUBRID_LOCALE=ko_KR.euckr, so createdb makes an EUC-KR testdb, and the
    # charset="euckr" round-trip tests that skip against a UTF-8 database.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      cubrid:
        image: cubrid/cubrid:11.4
        env:
          CUBRID_DB: testdb
          CUBRID_LOCALE: ko_KR.euckr
        ports:
          - 33000:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install pycubrid
        run: |
          uv pip install --system -e ".[dev]"
          uv pip freeze --system
      - name: Wait for CUBRID readiness
        run: python scripts/wait_for_cubrid.py
      - name: Run EUC-KR charset integration tests
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
        run: |
          python -m pytest tests/test_integration_charset.py -m integration -v --tb=short \
            --junitxml=charset-results.xml
          python scripts/check_integration_lanes.py --results charset-results.xml

  version-differential:
    needs: validate-target
    # Property-driven behavior differential (#351): the same generated values
    # and statements run against CUBRID 10.2, 11.0, 11.2 and 11.4 at once, and
    # any divergence not documented in tests/helpers/version_matrix.py fails.
    # Nightly/on demand only; the lane audit fails if every test skipped.
    name: version differential (10.2 / 11.0 / 11.2 / 11.4)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      cubrid102:
        image: cubrid/cubrid:10.2
        env:
          CUBRID_DB: testdb
        ports:
          - 33102:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
      cubrid110:
        image: cubrid/cubrid:11.0
        env:
          CUBRID_DB: testdb
        ports:
          - 33110:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
      cubrid112:
        image: cubrid/cubrid:11.2
        env:
          CUBRID_DB: testdb
        ports:
          - 33112:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
      cubrid114:
        image: cubrid/cubrid:11.4
        env:
          CUBRID_DB: testdb
        ports:
          - 33114:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    env:
      # Scheduled runs explore widely; a manual dispatch keeps the PR budget.
      HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || 'pr' }}
      CUBRID_VERSION_MATRIX: "10.2=localhost:33102,11.0=localhost:33110,11.2=localhost:33112,11.4=localhost:33114"
      CUBRID_TEST_URL: "cubrid://dba@localhost:33114/testdb"
      CUBRID_TEST_HOST: localhost
      CUBRID_TEST_PORT: "33114"
      CUBRID_TEST_DB: testdb
      CUBRID_TEST_USER: dba
      CUBRID_TEST_PASSWORD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install pycubrid
        run: |
          uv pip install --system -e ".[dev]"
          uv pip freeze --system
      - name: Wait for every CUBRID of the matrix
        run: |
          set -euo pipefail
          for port in 33102 33110 33112 33114; do
            CUBRID_TEST_PORT="$port" python scripts/wait_for_cubrid.py
          done
      - name: Run the version differential
        run: |
          python scripts/check_integration_lanes.py
          python -m pytest tests/ -m "integration and version_matrix" -v --tb=short \
            --junitxml=version-results.xml
          python scripts/check_integration_lanes.py --results version-results.xml
      - name: Collect repro artifacts on failure
        if: failure()
        run: python scripts/collect_repro.py
      - name: Upload repro artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: version-differential-repro
          path: bug-hunt-repro/
          if-no-files-found: ignore
          retention-days: 14

  official-differential:
    needs: validate-target
    # Claims-driven differential against the pinned official CUBRIDdb driver
    # (#446): tests/fixtures/official_differential_claims.json, one live case
    # per claim, both servers, no accepted skip. The oracle build is cached by
    # the build script hash, which holds both source pins.
    name: official differential (Python 3.11 / CUBRID 10.2 + 11.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      cubrid102:
        image: cubrid/cubrid:10.2
        env:
          CUBRID_DB: testdb
        ports:
          - 33102:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
      cubrid114:
        image: cubrid/cubrid:11.4
        env:
          CUBRID_DB: testdb
        ports:
          - 33114:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        id: python
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install pycubrid
        run: |
          uv pip install --system -e ".[dev]"
          uv pip freeze --system
      - name: Restore the official oracle build
        id: oracle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ${{ runner.temp }}/official-oracle
          key: official-oracle-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('scripts/build_official_oracle.py') }}
      - name: Build the pinned official oracle
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: python scripts/build_official_oracle.py --out "$RUNNER_TEMP/official-oracle" --work "$RUNNER_TEMP/official-oracle-work"
      - name: Verify the official oracle
        run: python scripts/build_official_oracle.py --out "$RUNNER_TEMP/official-oracle" --verify
      - name: Wait for CUBRID 10.2 and 11.4
        run: |
          set -euo pipefail
          for port in 33102 33114; do
            CUBRID_TEST_PORT="$port" python scripts/wait_for_cubrid.py
          done
      - name: Run the official differential
        env:
          CUBRID_TEST_HOST: localhost
          PYCUBRID_OFFICIAL_ORACLE_REQUIRED: "1"
          PYCUBRID_DIFFERENTIAL_EVIDENCE: official-evidence.jsonl
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/official-oracle"
          export PYCUBRID_OFFICIAL_ORACLE_MANIFEST="$RUNNER_TEMP/official-oracle/oracle.json"
          python scripts/check_official_differential.py
          python scripts/check_integration_lanes.py
          for port in 33102 33114; do
            export CUBRID_TEST_PORT="$port"
            python -m pytest tests/ -m "integration and official_differential" -v --tb=short \
              --junitxml="official-$port-results.xml"
            python scripts/check_integration_lanes.py --lane official --results "official-$port-results.xml"
          done
          python scripts/check_official_differential.py --evidence official-evidence.jsonl \
            --json-out official-evidence-summary.json --summary-out "$GITHUB_STEP_SUMMARY"
      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: official-differential-evidence
          path: |
            official-evidence.jsonl
            official-evidence-summary.json
            official-*-results.xml
            ${{ runner.temp }}/official-oracle/oracle.json
          if-no-files-found: ignore
          retention-days: 30

  offline-endpoints:
    needs: validate-target
    # The Python 3.11/3.14 offline suite with the 95% floor (#745) at the exact
    # release SHA (#750). The ci.yml push run of a release commit can be
    # cancelled by a later merge and nothing in the release path required it,
    # so the release runs these two cells itself. Install and test commands are
    # kept identical to ci.yml offline-tests (tests/test_ci_policy.py).
    name: offline-endpoints (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system pytest-cov
          uv pip freeze --system
      - name: Run offline tests with coverage
        shell: bash
        run: |
          python -m pytest tests/ \
            -m "not integration and not repo_tooling" \
            -v --tb=short \
            --cov=pycubrid \
            --cov-report=term-missing \
            --cov-report=xml:coverage-py${{ matrix.python-version }}.xml \
            --cov-fail-under=95

  # The four ci.yml lanes below (#750) run on the exact release SHA for the same
  # reason as offline-endpoints: a main push run of ci.yml covers them, but
  # nothing in the release path requires that run and a later merge can cancel
  # it. Each job copies its ci.yml source (same Python version, timeout and
  # steps). Only three things follow this workflow: `needs: validate-target`
  # replaces ci.yml's changed-path selection, the checkout drops credentials,
  # and setup-uv uses the `auto` cache mode. tests/test_ci_policy.py keeps the
  # copies equal to ci.yml.

  # Copy of ci.yml `lint`.
  lint:
    needs: validate-target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install pinned ruff from pyproject.toml
        run: |
          uv pip install --system -e ".[dev]"
          uv pip freeze --system
      - name: Check tool consistency, lint, and format maintained Python
        run: make lint
      - name: Lint CHANGELOG structure
        run: python scripts/lint_changelog.py
      - name: Korean documents keep the structure of their English source
        run: python scripts/check_docs_translation.py
      - name: llms-full.txt and root llms.txt are in sync with source docs
        run: |
          python scripts/generate_llms_full.py
          # --porcelain also reports a generated file that was deleted from the
          # commit and recreated untracked, which `git diff` would miss.
          if [ -n "$(git status --porcelain -- docs/llms-full.txt llms.txt)" ]; then
            echo "::error::docs/llms-full.txt or llms.txt is stale or missing. Edit docs/llms.txt (the canonical index), run 'python scripts/generate_llms_full.py' and commit the result."
            git status --short -- docs/llms-full.txt llms.txt
            git diff -- docs/llms-full.txt llms.txt
            exit 1
          fi

  # Copy of ci.yml `typecheck`.
  typecheck:
    needs: validate-target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          uv pip freeze --system
      - name: Mypy strict
        run: make typecheck

  # Copy of ci.yml `compat-check`.
  compat-check:
    needs: validate-target
    name: Public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install pycubrid (import-only)
        run: |
          uv pip install --system -e .
          uv pip freeze --system
      - name: Verify public API surface matches api-baseline.json
        run: python scripts/check_public_api.py

  # Copy of ci.yml `repo-tooling-tests`.
  repo-tooling-tests:
    needs: validate-target
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system -e ".[dev]"
          uv pip freeze --system
      - name: Run repository tooling tests
        shell: bash
        run: python -m pytest tests/ -m "repo_tooling" -v --tb=short

  full-matrix-result:
    name: Full compatibility matrix result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate-target, integration-full, integration-tls, integration-charset, version-differential, official-differential, offline-endpoints, lint, typecheck, compat-check, repo-tooling-tests]
    if: always()
    steps:
      - name: Require the full matrix to pass
        run: |
          if [ "${{ needs.validate-target.result }}" != "success" ]; then
            echo "::error::Manual target validation failed"
            exit 1
          fi
          if [ "${{ needs.integration-full.result }}" != "success" ]; then
            echo "::error::Full compatibility matrix failed: ${{ needs.integration-full.result }}"
            exit 1
          fi
          if [ "${{ needs.integration-tls.result }}" != "success" ]; then
            echo "::error::TLS full matrix failed: ${{ needs.integration-tls.result }}"
            exit 1
          fi
          if [ "${{ needs.integration-charset.result }}" != "success" ]; then
            echo "::error::EUC-KR charset lane failed: ${{ needs.integration-charset.result }}"
            exit 1
          fi
          if [ "${{ needs.version-differential.result }}" != "success" ]; then
            echo "::error::CUBRID version differential failed: ${{ needs.version-differential.result }}"
            exit 1
          fi
          if [ "${{ needs.official-differential.result }}" != "success" ]; then
            echo "::error::Official driver differential failed: ${{ needs.official-differential.result }}"
            exit 1
          fi
          if [ "${{ needs.offline-endpoints.result }}" != "success" ]; then
            echo "::error::Offline Python 3.11/3.14 endpoint cells failed: ${{ needs.offline-endpoints.result }}"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Lint failed: ${{ needs.lint.result }}"
            exit 1
          fi
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "::error::Type check failed: ${{ needs.typecheck.result }}"
            exit 1
          fi
          if [ "${{ needs.compat-check.result }}" != "success" ]; then
            echo "::error::Public API compatibility failed: ${{ needs.compat-check.result }}"
            exit 1
          fi
          if [ "${{ needs.repo-tooling-tests.result }}" != "success" ]; then
            echo "::error::Repository tooling tests failed: ${{ needs.repo-tooling-tests.result }}"
            exit 1
          fi
          echo "Full compatibility matrix passed."

      - name: Verify requested manual commit and current PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_CALL: ${{ inputs.release_call || false }}
        with:
          script: |
            if (process.env.RELEASE_CALL === 'true' || context.eventName !== 'workflow_dispatch') return;
            const inputs = context.payload.inputs || {};
            const sha = (inputs.sha || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha) || sha !== context.sha.toLowerCase()) {
              throw new Error('Dispatch branch must point at the requested full commit SHA');
            }
            const pr = inputs.pr_number || '';
            if (pr) {
              if (!/^[1-9][0-9]*$/.test(pr) || !Number.isSafeInteger(Number(pr))) {
                throw new Error('PR number must be a positive integer');
              }
              const {data} = await github.rest.pulls.get({...context.repo, pull_number: Number(pr)});
              const repo = `${context.repo.owner}/${context.repo.repo}`;
              if (data.base.repo.full_name !== repo || data.state !== 'open' || data.head.sha.toLowerCase() !== sha) {
                throw new Error('Requested commit is no longer the current open PR head');
              }
            }
            await core.summary.addRaw(`Validated commit: ${sha}; PR: ${pr || 'none'}`).write();
