name: Security Scans

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  # A newer push to a PR supersedes its older run. Every non-PR run gets a
  # unique group, so main, release and scheduled runs are never cancelled and
  # never replaced while queued behind another run of the same ref.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-only:
    name: Classify documentation-only PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.classify.outputs.skip }}
    steps:
      - name: Inspect every changed file (fail open to security scans)
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let skip = false;
            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              // The list-files endpoint caps results at 3,000. Compare with
              // the PR's declared count and never exempt an incomplete list.
              const pr = await github.rest.pulls.get({
                ...context.repo,
                pull_number: context.payload.pull_request.number,
              });
              const changed = pr.data.changed_files;
              skip = Number.isInteger(changed) && changed > 0 && changed < 3000
                && files.length === changed
                && files.every(file =>
                  typeof file.filename === 'string'
                  && /\.md$/i.test(file.filename)
                  // Source -> Markdown renames are still source changes.
                  && (file.status !== 'renamed'
                    || (typeof file.previous_filename === 'string'
                      && /\.md$/i.test(file.previous_filename)))
                );
            } catch (error) {
              core.warning(`Cannot inspect changed files; run security scans: ${error.message}`);
            }
            core.setOutput('skip', String(skip));

  bandit:
    needs: docs-only
    if: ${{ always() && (github.event_name != 'pull_request' || needs.docs-only.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group security

      - name: Run Bandit
        run: bandit -r pycubrid/ -c pyproject.toml

  semgrep:
    needs: docs-only
    if: ${{ always() && (github.event_name != 'pull_request' || needs.docs-only.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/python
