name: Python 3.15 Packaging Check

# One manually requested lane: offline regressions and fresh wheel/sdist installs
# on Python 3.15. Supported versions are declared in pyproject.toml and tested by
# the full compatibility matrix (integration-full.yml), not by this lane.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA; dispatch the branch at this exact commit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: python315-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUESTED_SHA: ${{ inputs.sha }}
    steps:
      - name: Validate immutable requested commit
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          printf 'Requested commit: %s\n' "$REQUESTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Record interpreter and verify version
        run: |
          python -VV
          python -c "import sys, sysconfig; assert sys.version_info[:2] == (3, 15); assert not sysconfig.get_config_var('Py_GIL_DISABLED')"
      - name: Install test and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group test --group release
          python -m pip freeze
      - name: Run offline regressions
        run: python -m pytest tests/ -m "not integration and not repo_tooling" -q
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Check fresh wheel and sdist installations outside the source tree
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            env_dir=$(mktemp -d)
            python -m venv "$env_dir/venv"
            "$env_dir/venv/bin/python" -m pip install --upgrade pip
            "$env_dir/venv/bin/python" -m pip install "$artifact"
            (
              cd "$env_dir"
              "$env_dir/venv/bin/python" -c "import pathlib, sys, importlib.metadata as m, pycubrid, pycubrid.aio; assert pathlib.Path(pycubrid.__file__).is_relative_to(sys.prefix); assert pycubrid.__version__ == m.version('pycubrid')"
            )
          done
      - name: Record evidence status
        if: always()
        env:
          PREVIEW_STATUS: ${{ job.status }}
        run: |
          {
            printf '## Python 3.15 packaging check\n\n'
            printf 'Commit: %s\n\n' "$REQUESTED_SHA"
            printf 'Result: %s\n\n' "$PREVIEW_STATUS"
            printf 'Manual Ubuntu/standard-GIL offline and packaging check. Live CUBRID coverage for 3.15 is in integration-full.yml.\n'
          } >> "$GITHUB_STEP_SUMMARY"
