name: Bug Hunt (nightly)

# Adversarial Bug Hunt layer (epic #336). Runs the integration-marked property
# fuzzing, protocol fuzzing, state-machine, metamorphic, fault-injection,
# differential, resource-leak, PEP 249 runtime, chaos and soak suites under the
# WIDE Hypothesis profile against a live CUBRID broker, plus mutation testing of
# the driver core, a benchmark trend check and downstream dogfooding. Nightly +
# on demand only; PR CI keeps the fast profile.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: bug-hunt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  property-and-fault:
    name: property / protocol / state-machine / fault / chaos / soak (nightly)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        cubrid-version: ["10.2", "11.0", "11.2", "11.4"]
    services:
      cubrid:
        image: cubrid/cubrid:${{ matrix.cubrid-version }}
        env:
          CUBRID_DB: testdb
        ports:
          - 33000:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    env:
      HYPOTHESIS_PROFILE: nightly
      SOAK_SECONDS: "1800"
      CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
      CUBRID_TEST_HOST: localhost
      CUBRID_TEST_PORT: "33000"
      CUBRID_TEST_DB: testdb
      CUBRID_TEST_USER: dba
      CUBRID_TEST_PASSWORD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pycubrid
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Wait for CUBRID readiness
        run: python scripts/wait_for_cubrid.py
      - name: Run the bug-hunt integration suites (wide Hypothesis profile)
        env:
          # Broker-control regressions (#485) run broker_changer/broker reset here.
          CUBRID_TEST_DOCKER_CONTAINER: ${{ job.services.cubrid.id }}
        run: |
          python scripts/check_integration_lanes.py
          python -m pytest tests/ -m "integration and not slow and not tls" -v --tb=short \
            --junitxml=normal-results.xml
          python scripts/check_integration_lanes.py --results normal-results.xml
      - name: Run slow soak chaos and concurrency suites
        timeout-minutes: 90
        run: |
          python -m pytest tests/ -m "integration and slow and not tls" -v --tb=short \
            --junitxml=slow-results.xml
          python scripts/check_integration_lanes.py --results slow-results.xml
      - name: Run offline protocol fault and placeholder suites
        run: |
          python -m pytest tests/test_protocol_fuzz.py tests/test_fault_broker.py \
            tests/test_property_placeholders.py -m "not integration" -v --tb=short
      - name: Collect repro artifacts on failure
        if: failure()
        run: python scripts/collect_repro.py
      - name: Upload repro artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bug-hunt-repro-${{ matrix.cubrid-version }}
          path: bug-hunt-repro/
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    name: mutation testing (driver core, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - name: Install pycubrid
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mutation]"
      - name: Run mutation testing
        run: |
          mutmut run
          mutmut results
      - name: Upload mutation cache
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-cache
          path: .mutmut-cache
          if-no-files-found: ignore
          retention-days: 14

  perf-trend:
    name: benchmark trend detection
    runs-on: ubuntu-latest
    services:
      cubrid:
        image: cubrid/cubrid:11.4
        env:
          CUBRID_DB: testdb
        ports:
          - 33000:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    env:
      CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
      CUBRID_TEST_HOST: localhost
      CUBRID_TEST_PORT: "33000"
      CUBRID_TEST_DB: testdb
      CUBRID_TEST_USER: dba
      CUBRID_TEST_PASSWORD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - name: Install pycubrid
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Wait for CUBRID readiness
        run: python scripts/wait_for_cubrid.py
      - name: Run benchmarks to JSON
        run: |
          python -m pytest tests/test_benchmarks.py --benchmark-enable \
            --benchmark-json=current-bench.json -q
      # Restore the most recent baseline. The cache action only writes on a miss,
      # so we always use a fresh per-run key and fall back to the newest prior
      # key via restore-keys — that way each night compares against yesterday and
      # then persists a new baseline entry under today's key.
      - name: Restore benchmark baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: baseline-bench.json
          key: bench-baseline-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bench-baseline-${{ github.ref_name }}-
      - name: Compare against baseline (trend report)
        run: |
          if [ -f baseline-bench.json ]; then
            python scripts/bench_regression.py \
              --baseline baseline-bench.json --current current-bench.json
          else
            echo "No baseline yet; seeding it from this run."
          fi
          cp current-bench.json baseline-bench.json
      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-json
          path: current-bench.json
          if-no-files-found: ignore
          retention-days: 30

  downstream-corpus:
    name: downstream corpus (${{ matrix.lane }}, CUBRID 11.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Corpus is nightly/on-demand evidence, not a PR or release gate. The
    # per-lane step summary and uploaded JSON still report a real failure.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: sqlalchemy
            repository: cubrid-lab/sqlalchemy-cubrid
          - lane: mcp
            repository: cubrid-lab/cubrid-mcp-server
          - lane: cookbook
            repository: cubrid-lab/cubrid-cookbook-python
    services:
      cubrid:
        image: cubrid/cubrid:11.4
        env:
          CUBRID_DB: testdb
        ports:
          - 33000:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    env:
      DRIVER_SHA: ${{ github.sha }}
      CUBRID_TEST_HOST: localhost
      CUBRID_TEST_PORT: "33000"
      CUBRID_TEST_DB: testdb
      CUBRID_TEST_USER: dba
      CUBRID_TEST_PASSWORD: ""
    steps:
      - name: Check out exact driver revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: cubrid-lab/pycubrid
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - name: Check out latest downstream revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ matrix.repository }}
          ref: main
          path: downstream
          persist-credentials: false
      - name: Record tested revisions
        run: |
          set -euo pipefail
          [ "$(git -C driver rev-parse HEAD)" = "$DRIVER_SHA" ]
          downstream_sha=$(git -C downstream rev-parse HEAD)
          [[ "$downstream_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "DOWNSTREAM_SHA=$downstream_sha" >> "$GITHUB_ENV"
          printf 'Driver: %s; downstream %s: %s\n' \
            "$DRIVER_SHA" '${{ matrix.repository }}' "$downstream_sha"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - name: Install all dependencies under the exact driver constraint
        run: |
          set -euo pipefail
          [[ "$DRIVER_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/downstream-corpus"
          printf 'pycubrid @ git+https://github.com/cubrid-lab/pycubrid.git@%s\n' \
            "$DRIVER_SHA" > "$RUNNER_TEMP/downstream-corpus/driver-constraint.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/downstream-corpus/driver-constraint.txt"
          echo "PIP_CONSTRAINT=$PIP_CONSTRAINT" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          python -m pip install "pycubrid @ git+https://github.com/cubrid-lab/pycubrid.git@$DRIVER_SHA"
          case '${{ matrix.lane }}' in
            sqlalchemy)
              python -m pip install -e './downstream[pycubrid]' pytest pytest-asyncio ;;
            mcp)
              python -m pip install -e ./downstream pytest ;;
            cookbook)
              python -m pip install -r downstream/templates/ai-agent/requirements.txt \
                -r downstream/templates/async-worker/requirements.txt pytest ;;
            *) echo 'Unrecognized downstream lane' >&2; exit 1 ;;
          esac
      - name: Wait for CUBRID readiness
        run: python driver/scripts/wait_for_cubrid.py
      - name: Verify installed driver origin and actual server
        run: |
          python driver/scripts/downstream_corpus.py verify-driver \
            --expected-sha "$DRIVER_SHA" \
            --out "$RUNNER_TEMP/downstream-corpus/driver.json"
      - name: Run SQLAlchemy ORM and pool workloads
        id: sa_tests
        if: matrix.lane == 'sqlalchemy'
        env:
          CUBRID_TEST_URL: "cubrid+pycubrid://dba@localhost:33000/testdb"
        working-directory: downstream
        run: |
          status=0
          python -m pytest test/test_dogfood_orm.py -m integration -v --tb=short \
            --junitxml="$RUNNER_TEMP/downstream-corpus/dogfood.xml" || status=1
          python -m pytest test/test_stress_pool.py -m integration -v --tb=short \
            --junitxml="$RUNNER_TEMP/downstream-corpus/pool.xml" || status=1
          exit "$status"
      - name: Run MCP live tool workload
        id: mcp_tests
        if: matrix.lane == 'mcp'
        env:
          CUBRID_HOST: localhost
          CUBRID_PORT: "33000"
          CUBRID_USER: dba
          CUBRID_PASSWORD: ""
          CUBRID_DATABASE: testdb
        working-directory: downstream
        run: |
          python -m pytest tests/test_integration.py -m integration -v --tb=short \
            --junitxml="$RUNNER_TEMP/downstream-corpus/mcp.xml"
      - name: Run cookbook AI and worker workloads
        id: cookbook_tests
        if: matrix.lane == 'cookbook'
        env:
          CUBRID_TEST_URL: "cubrid+pycubrid://dba@localhost:33000/testdb"
        working-directory: downstream
        run: |
          status=0
          python -m pytest tests/test_ai_agent.py -v --tb=short \
            --junitxml="$RUNNER_TEMP/downstream-corpus/ai.xml" || status=1
          # Generic app/database/models modules must not cross-contaminate.
          python -m pytest templates/async-worker/tests -v --tb=short \
            --junitxml="$RUNNER_TEMP/downstream-corpus/worker.xml" || status=1
          exit "$status"
      - name: Summarize downstream evidence
        if: always()
        env:
          LANE: ${{ matrix.lane }}
          JOB_STATUS: ${{ job.status }}
          SA_TEST_OUTCOME: ${{ steps.sa_tests.outcome }}
          MCP_TEST_OUTCOME: ${{ steps.mcp_tests.outcome }}
          COOKBOOK_TEST_OUTCOME: ${{ steps.cookbook_tests.outcome }}
        run: |
          if [ ! -f driver/scripts/downstream_corpus.py ]; then
            mkdir -p "$RUNNER_TEMP/downstream-corpus"
            printf 'Downstream corpus %s failed before driver checkout (%s)\n' \
              "$LANE" "$DRIVER_SHA" \
              | tee "$RUNNER_TEMP/downstream-corpus/checkout-failure.txt" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          case "$LANE" in
            sqlalchemy) test_outcome="$SA_TEST_OUTCOME" ;;
            mcp) test_outcome="$MCP_TEST_OUTCOME" ;;
            cookbook) test_outcome="$COOKBOOK_TEST_OUTCOME" ;;
            *) echo 'Unrecognized downstream lane' >&2; exit 1 ;;
          esac
          python driver/scripts/downstream_corpus.py report \
            --lane "$LANE" \
            --report-dir "$RUNNER_TEMP/downstream-corpus" \
            --driver-evidence "$RUNNER_TEMP/downstream-corpus/driver.json" \
            --expected-sha "$DRIVER_SHA" \
            --downstream-sha "${DOWNSTREAM_SHA:-}" \
            --job-status "$JOB_STATUS" \
            --test-outcome "$test_outcome" \
            --out "$RUNNER_TEMP/downstream-corpus/summary.json" \
            --markdown "$RUNNER_TEMP/downstream-corpus/summary.md" \
            --step-summary "$GITHUB_STEP_SUMMARY"
      - name: Upload downstream evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: downstream-corpus-${{ matrix.lane }}
          path: ${{ runner.temp }}/downstream-corpus/
          if-no-files-found: warn
          retention-days: 30
