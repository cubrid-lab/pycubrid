name: One-off historical pycubrid Release notes sync

# Intentionally one-off. A reviewed merge of the three pinned files below
# triggers the guarded 11-body publication. No schedule or general publisher.
# Remove this workflow in a separate reviewed cleanup PR after 35/35 verification.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-off-published-release-notes-sync.yml
      - scripts/release_notes_sync_20261114.json
      - scripts/sync_published_release_notes_once.py
  workflow_dispatch:
    inputs:
      mode:
        description: Audit only by default; apply the reviewed pinned sync explicitly
        type: choice
        options:
          - audit
          - apply
        default: audit

permissions: {}

concurrency:
  group: pycubrid-historical-release-note-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'cubrid-lab/pycubrid' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Update existing GitHub Release descriptions only
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Test pinned source and fail-closed preflight
        run: |
          python -m pip install pytest==9.2.0 hypothesis==6.170.9
          python -m pytest -q tests/test_sync_published_release_notes_once.py

      - name: Save original release snapshot and audit pinned changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_published_release_notes_once.py --mode audit

      - name: Apply only the 11 independently reviewed body changes
        if: github.event_name == 'push' || inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_published_release_notes_once.py --mode apply

      - name: Preserve original descriptions and verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: historical-release-notes-sync-evidence
          path: ${{ runner.temp }}/pycubrid-release-sync-20261114/
          retention-days: 30
          if-no-files-found: warn
