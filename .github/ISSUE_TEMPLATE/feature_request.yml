name: Feature Request
description: Suggest a new feature or enhancement
title: "feat: "
labels: ["enhancement", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        File implementation work in this repository. Other repositories own
        their own scope, acceptance, priority and issue closure; link genuine
        cross-repository technical dependencies as references only.
        Keep the `feat:` title prefix. You do not need to apply labels;
        maintainers assign priority and size after triage.
        Keep this body as the current specification; put dated progress in comments.
        Before implementation, check existing Assignees, claims and open PRs.
        Maintainer-operated autonomous agents also need issue-specific approval
        and assignment; human-led contributors need neither.
        Triage labels do not approve a new public API. If this request would add
        an exported method/type, change a public contract, add a runtime
        dependency or alter the support policy, maintainers record an
        independent product decision before directing implementation.
        You can submit a question or proposal without knowing the solution.
        Removing pycubrid.compat does not automatically justify recreating
        its features in pycubrid / pycubrid.aio.
        For a claimed capability gap, try to falsify it with the nearest
        existing API, supported SQL or documentation before proposing a new
        contract. Reporters may leave investigation details unknown.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: Describe the problem or use case this feature addresses
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Optional idea or open design question; proposing a solution does not approve implementation
      placeholder: What behavior might help, or which decision should maintainers investigate?
    validations:
      required: false

  - type: textarea
    id: independent_need
    attributes:
      label: Independent user need and existing API alternatives
      description: For new public APIs, explain the ordinary-driver use case and the strongest existing API or SQL workaround you checked. Distinguish a failed attempt from proof that no workaround exists. If unknown, leave this for maintainer investigation.
      placeholder: Who needs this, what can they do today, and why would a permanent API be justified?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives, counterexamples and existing documented approaches you checked. What would disprove the claimed gap? Say unknown if you have not tested them.
      placeholder: What other approaches could solve this problem?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the feature request here
      placeholder: Related issues, code examples, documentation links, etc.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What is included in this issue? What is explicitly excluded?
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and starting point
      description: Record exact failing and working commands/results and Python/CUBRID versions when known. A failed SQL syntax or empty search does not prove that a capability is missing. Separate observations, counterchecks, source inspection and unverified assumptions. Reporters may write unknown.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Completion criteria
      description: Give observable outcomes that decide when this issue is done. For research, state the decision or report to deliver.
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: Validation method
      description: State offline/live needs, environment and the command or manual check if known. Reporters may write unknown; maintainers refine this before implementation.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Link the specific unfinished prerequisite and existing PR/claim. Completed work is a reference, not a blocker.
    validations:
      required: false
