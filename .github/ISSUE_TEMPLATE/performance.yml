name: Performance Investigation
description: Report a measured performance regression or gap detected by cubrid-benchmark
title: "perf: "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template when cubrid-benchmark detects a measurable performance gap or regression.
        Link to the benchmark run that triggered this investigation.
        Keep the `perf:` title prefix. You do not need to apply labels;
        maintainers assign priority and size after triage.
        Keep this body as the current specification; put dated progress in comments.
        Confirm availability and Assignee ownership before implementation.

  - type: textarea
    id: benchmark-source
    attributes:
      label: Benchmark Source
      description: Link to the cubrid-benchmark run or report that triggered this investigation
      placeholder: |
        https://github.com/cubrid-lab/cubrid-benchmark/actions/runs/...
        or paste the relevant benchmark output table
    validations:
      required: true

  - type: dropdown
    id: operations-affected
    attributes:
      label: Operation(s) Affected
      description: Which database operation(s) show the performance gap?
      options:
        - connect
        - execute
        - fetch
        - other
      multiple: true
    validations:
      required: true

  - type: textarea
    id: measured-delta
    attributes:
      label: Measured Delta
      description: Quantify the performance gap with CI run provenance
      placeholder: |
        Baseline (before): X ops/sec (run: <CI link>)
        Current (after):   Y ops/sec (run: <CI link>)
        Delta: Z% regression vs the baseline run

        Include the full benchmark result table if available.
    validations:
      required: true

  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs Actual Performance
      description: Describe what performance level is expected and what was observed
      placeholder: |
        Expected: Similar throughput to the previous run or release on the same CUBRID server
        Actual:   Nx slower, specifically on <operation> with <row count> rows
    validations:
      required: true

  - type: textarea
    id: profiling-results
    attributes:
      label: Profiling Results
      description: |
        Paste cProfile output from the relevant profiling script.
        Run: python scripts/profile_connect.py  (or profile_execute.py / profile_fetch.py)
      placeholder: |
        $ python scripts/profile_connect.py --iterations 100
           ncalls  tottime  percall  cumtime  percall filename:lineno(function)
           ...

        Attach .prof file (snakeviz-compatible) if available.
    validations:
      required: false

  - type: textarea
    id: fix-verification
    attributes:
      label: Fix Verification
      description: After the fix, re-run the benchmark and paste results here with a link
      placeholder: |
        Fix applied: <PR link or commit>
        Re-benchmark run: <CI link>

        Before: X ops/sec
        After:  Y ops/sec
        Improvement: Z%
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What is included in this issue? What is explicitly excluded?
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and starting point
      description: Link the baseline commit, relevant files/tests and observed output. Separate source inspection from executed tests; say what is not verified.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Completion criteria
      description: Give observable outcomes that decide when this issue is done. For research, state the decision or report to deliver.
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: Validation method
      description: State offline/live needs, environment and the command or manual check if known. Reporters may write unknown; maintainers refine this before implementation.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Link the specific unfinished prerequisite and existing PR/claim. Completed work is a reference, not a blocker.
    validations:
      required: false
