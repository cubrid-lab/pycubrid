files: "^(pycubrid|tests|scripts|demos)/"
repos:
  - repo: local
    hooks:
      - id: quality-tool-consistency
        name: quality-tool consistency
        entry: python3 scripts/check_quality_tools.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
      - id: ruff
        types_or: [python, pyi]
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        language: python
        files: "^pycubrid/"
        pass_filenames: false
        args:
          [
            "--config-file=pyproject.toml",
            "--install-types",
            "--non-interactive",
            "pycubrid/"
          ]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: "^pycubrid/"
