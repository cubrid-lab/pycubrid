files: "^(pycubrid|tests|scripts|demos|examples)/"
repos:
  - repo: local
    hooks:
      - id: quality-tool-consistency
        name: quality-tool consistency
        entry: python3 scripts/check_quality_tools.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff-format
        entry: python3 -m ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff
        name: ruff
        entry: python3 -m ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: python3 -m mypy
        language: system
        files: "^pycubrid/"
        pass_filenames: false
        args:
          [
            "--config-file=pyproject.toml",
            "--install-types",
            "--non-interactive",
            "pycubrid/"
          ]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: "^pycubrid/"
