[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycubrid"
dynamic = ["version"]
description = "Pure Python DB-API 2.0 driver for CUBRID database"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Yeongseon Choe", email = "yeongseon.choe@gmail.com"},
    {name = "Gyeongjun Paik", email = "paikend@gmail.com"},
]
keywords = ["CUBRID", "database", "driver", "DB-API", "PEP 249", "tls", "ssl", "starttls", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",
]
dependencies = [
    # Windows ships no IANA time zone database; zoneinfo needs it for
    # TIMESTAMPTZ/DATETIMETZ region names (#413).
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov",
    "pytest-benchmark>=4.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "bandit[toml]==1.9.4",
    "pre-commit",
    "tox",
    "build",
    "twine",
    "hypothesis>=6.0",
]
mutation = [
    "mutmut>=3.8,<4",
]

[project.urls]
Homepage = "https://github.com/cubrid-lab/pycubrid"
Repository = "https://github.com/cubrid-lab/pycubrid"
Documentation = "https://cubrid-lab.github.io/pycubrid/"
Changelog = "https://github.com/cubrid-lab/pycubrid/blob/main/CHANGELOG.md"
Issues = "https://github.com/cubrid-lab/pycubrid/issues"

[tool.setuptools]
packages = ["pycubrid", "pycubrid.aio", "pycubrid.compat"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pycubrid.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"
# Keep CLI discovery aligned with the Python/pyi-only pre-commit hooks.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
# Pin the rule set explicitly instead of inheriting ruff's implicit defaults.
# Ruff expanded its default selection in 0.16 (59 -> 413 rules against this
# config), which turns every routine ruff bump into a CI-breaking change
# unrelated to our own code. These four groups are exactly what ruff selected
# by default through 0.15.x.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
known-first-party = ["pycubrid"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.coverage.run]
source = ["pycubrid"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb native -v -r fxX --maxfail=25 -p no:warnings"
python_files = "tests/*test_*.py"
markers = [
    "integration: requires a live CUBRID server",
    "slow: long-running tests (soak, stress, chaos) excluded from the standard full matrix",
    "tls: TLS-specific integration tests run in the dedicated integration-tls job",
    "version_matrix: cross-version differential run against every CUBRID in CUBRID_VERSION_MATRIX (version-differential job)",
    "official_differential: claims-driven comparison with the pinned official CUBRIDdb driver (official-differential job, #446)",
    "benchmark: performance benchmark (requires a live CUBRID server)",
    "no_escape_pin: opt out of the autouse backslash-escape-mode default pin to exercise real negotiation (#524)",
    "repo_tooling: repository policy/tooling check (docs, release scripts, CI workflow contracts, PR title) with no pycubrid driver behavior, run in the repo-tooling-tests job (#558)",
]

[tool.mutmut]
# Mutation testing scopes the driver core — the modules where a wrong constant,
# flipped comparison, or dropped cleanup silently corrupts data or leaks
# resources. The offline suite is the test command (no DB), so mutants are
# killed by the property/protocol/state-machine tests, not live integration.
#
# mutmut 3 keys (#612). The 2.x spelling (paths_to_mutate / tests_dir / runner)
# crashed mutmut 3 on import, and its comma-joined strings were read as one
# Path per character, so nothing was ever measured.
source_paths = ["pycubrid"]
only_mutate = [
    "pycubrid/packet.py",
    "pycubrid/protocol.py",
    "pycubrid/_cursor_common.py",
    "pycubrid/_connection_common.py",
    "pycubrid/cursor.py",
    "pycubrid/connection.py",
    "pycubrid/lob.py",
    "pycubrid/aio/connection.py",
    "pycubrid/aio/cursor.py",
]
# Into mutants/ mutmut copies source_paths plus a built-in list (tests/, test/,
# pyproject.toml, lock files) and nothing else; entries here are added to that
# list, not substituted for it. The offline suite imports scripts/ and reads
# .github/workflows/ and docs/, tests/test_record_demo.py imports demos/ and
# tests/test_makefile_integration_cleanup.py runs the real Makefile, so the
# sandbox needs them. A missing entry fails the stats run before any mutant is
# tested ("failed to collect stats").
also_copy = ["scripts", ".github", "docs", "demos", "Makefile"]
# mutmut 3 adds -x -q itself. repo_tooling checks exercise repository policy and
# carry no driver behavior (see the marker definition above), so they cannot kill
# a driver mutant; they only lengthen the run. This is the same selection CI's
# offline job uses.
#
# The two deselected tests inspect pycubrid's own source rather than its
# behavior, so mutmut's trampoline wrapping defeats them no matter which mutant
# is active: the first asserts an UnknownConnectionOptionWarning is blamed on the
# caller's file and gets pycubrid/_connection_common.py (the trampoline adds a
# frame, shifting stacklevel); the second compares the hand-written option
# allow-list against inspect.signature() of the connection constructors, which
# the trampoline rewrites. Running the offline lane inside mutants/ without -x
# shows these are the only two, so the rest of the lane stays selected. Both are
# covered normally by every other lane.
pytest_add_cli_args = [
    "-m",
    "not integration and not repo_tooling",
    "-p",
    "no:cacheprovider",
    "--deselect",
    "tests/test_unknown_options.py::TestUnknownOptionsWarn::test_warning_points_at_the_caller_not_at_pycubrid",
    "--deselect",
    "tests/test_unknown_options.py::TestAllowListDoesNotDrift::test_allow_list_matches_public_signatures_and_kwargs_reads",
]
pytest_add_cli_args_test_selection = ["tests"]
# Default "fork" isolation forks each mutant from a process that has already run
# the suite, so Hypothesis sees the same test executed under a second executor and
# fails HealthCheck.differing_executors (observed on
# tests/test_property.py::TestRoundTripProperties::test_byte_round_trip during the
# clean-test phase). forkserver forks from a process that has collected but not run
# the tests, which keeps that state out of the children.
process_isolation = "forkserver"
