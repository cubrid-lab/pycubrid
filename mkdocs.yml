site_name: pycubrid
site_description: Pure Python DB-API 2.0 driver for CUBRID database
site_author: cubrid-lab
site_url: https://cubrid-lab.github.io/pycubrid/
repo_url: https://github.com/cubrid-lab/pycubrid
edit_uri: edit/main/docs/

theme:
  name: material
  # CUBRID Lab repository icon, pinned to an immutable cubrid-lab/brand commit.
  logo: https://raw.githubusercontent.com/cubrid-lab/brand/94e2bf6b915d7ef6a1111e06376f693f70bf6c4e/dist/icons/pycubrid.svg
  favicon: https://raw.githubusercontent.com/cubrid-lab/brand/94e2bf6b915d7ef6a1111e06376f693f70bf6c4e/dist/icons/pycubrid.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Start here:
      - Your First Connection: quickstart.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Usage:
      - Examples: EXAMPLES.md
      - Connection Guide: CONNECTION.md
      - Parameter Binding: PARAMETER_BINDING.md
      - Type Mapping: TYPES.md
  - Reference:
      - API Reference: API_REFERENCE.md
      - Protocol: PROTOCOL.md
      - Architecture: ARCHITECTURE.md
      - Support Matrix: SUPPORT_MATRIX.md
      - Upstream Scenario Ledger: UPSTREAM_TEST_LEDGER.md
      - Official Driver API Inventory: UPSTREAM_COMPATIBILITY.md
      - Typed CAS Binding Design: PREPARED_BINDING_DESIGN.md
  - Operations:
      - Performance: PERFORMANCE.md
  - Project:
      - Development: DEVELOPMENT.md
      - CI Execution Policy: CI_POLICY.md
      - Product Requirements: PRD.md
      - FAQ: faq.md
      - Translations:
          - Deutsch: README.de.md
          - हिन्दी: README.hi.md
          - Русский: README.ru.md
          - 中文: README.zh.md
      - Changelog: https://github.com/cubrid-lab/pycubrid/blob/main/CHANGELOG.md
      - Contributing: https://github.com/cubrid-lab/pycubrid/blob/main/CONTRIBUTING.md
  - 한국어:
      - 홈: ko/index.md
      - 여기서 시작:
          - 처음으로 연결하기: ko/quickstart.md
          - 문제 해결: ko/TROUBLESHOOTING.md
      - 사용:
          - 사용 예제: ko/EXAMPLES.md
          - 연결 가이드: ko/CONNECTION.md
          - 파라미터 바인딩: ko/PARAMETER_BINDING.md
          - 타입 시스템: ko/TYPES.md
      - 참고:
          - API 참조: ko/API_REFERENCE.md
          - CAS 프로토콜: ko/PROTOCOL.md
          - 아키텍처: ko/ARCHITECTURE.md
          - 지원 매트릭스: ko/SUPPORT_MATRIX.md
          - 업스트림 시나리오 원장: ko/UPSTREAM_TEST_LEDGER.md
          - 공식 드라이버 API 목록: ko/UPSTREAM_COMPATIBILITY.md
          - 타입 지정 CAS 바인딩 설계: ko/PREPARED_BINDING_DESIGN.md
      - 운영:
          - 성능 가이드: ko/PERFORMANCE.md
          - 자주 묻는 질문: ko/faq.md
      - 프로젝트:
          - 개발 가이드: ko/DEVELOPMENT.md
          - CI 실행 정책: ko/CI_POLICY.md
          - 제품 요구사항: ko/PRD.md
          - 기여 가이드: CONTRIBUTING.ko.md
          - README: README.ko.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
      # Unicode-aware slugs, as GitHub renders them: the default slugifier drops
      # non-ASCII characters, which left every Korean heading without a usable id.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore
    anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cubrid-lab/pycubrid
