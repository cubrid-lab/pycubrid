site_name: pycubrid
site_description: Pure Python DB-API 2.0 driver for CUBRID database
site_author: cubrid-lab
site_url: https://cubrid-lab.github.io/pycubrid/
repo_url: https://github.com/cubrid-lab/pycubrid
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: quickstart.md
      - Connection Guide: CONNECTION.md
      - Examples: EXAMPLES.md
  - Usage:
      - API Reference: API_REFERENCE.md
      - Type Mapping: TYPES.md
      - Parameter Binding: PARAMETER_BINDING.md
      - Protocol: PROTOCOL.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - Support Matrix: SUPPORT_MATRIX.md
  - Operations:
      - Performance: PERFORMANCE.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Project:
      - Development: DEVELOPMENT.md
      - FAQ: faq.md
      - Translations:
          - 한국어: README.ko.md
          - 한국어 문서:
              - 빠른 시작: ko/quickstart.md
              - 연결 가이드: ko/CONNECTION.md
              - 사용 예제: ko/EXAMPLES.md
              - 자주 묻는 질문: ko/faq.md
              - 파라미터 바인딩: ko/PARAMETER_BINDING.md
              - 타입 시스템: ko/TYPES.md
          - Deutsch: README.de.md
          - हिन्दी: README.hi.md
          - Русский: README.ru.md
          - 中文: README.zh.md
      - Changelog: https://github.com/cubrid-lab/pycubrid/blob/main/CHANGELOG.md
      - Contributing: https://github.com/cubrid-lab/pycubrid/blob/main/CONTRIBUTING.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cubrid-lab/pycubrid
