site_name: pycubrid
site_description: Pure Python DB-API 2.0 driver for CUBRID database
site_author: cubrid-lab
site_url: https://cubrid-lab.github.io/pycubrid/
repo_url: https://github.com/cubrid-lab/pycubrid
edit_uri: edit/main/docs/

theme:
  name: material
  # The development-documentation notice on every page (#960).
  custom_dir: docs/overrides
  # CUBRID Lab repository icon, pinned to an immutable cubrid-lab/brand commit.
  logo: https://raw.githubusercontent.com/cubrid-lab/brand/3a385be773af94077c56548a24cdb9313bdc3b5c/dist/icons/pycubrid.svg
  favicon: https://raw.githubusercontent.com/cubrid-lab/brand/3a385be773af94077c56548a24cdb9313bdc3b5c/dist/icons/pycubrid.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Start here:
      - "1. Your First Connection": quickstart.md
      - "2. Run Your First Query": first-query.md
      - "3. Save a Row": save-a-row.md
      - "4. Commit and Roll Back": commit-and-rollback.md
      - "5. Finish Safely": finish-safely.md
  - Usage:
      - Examples: EXAMPLES.md
  - Reference:
      - API Reference: API_REFERENCE.md
      - Connection Options (Connection Guide): CONNECTION.md
      - Passing Values Safely (Parameter Binding): PARAMETER_BINDING.md
      - Type Mapping: TYPES.md
      - Support Matrix: SUPPORT_MATRIX.md
      - "Advanced: CAS Architecture and Protocol": CAS_OVERVIEW.md
  - Help:
      - Troubleshooting: TROUBLESHOOTING.md
      - FAQ: faq.md
      - Report a Bug: https://github.com/cubrid-lab/pycubrid/issues/new/choose
      - Report a Vulnerability: https://github.com/cubrid-lab/pycubrid/blob/main/SECURITY.md
  - Operations:
      - Performance: PERFORMANCE.md
  - Development and contributing:
      - Development: DEVELOPMENT.md
      - Architecture: ARCHITECTURE.md
      - Protocol: PROTOCOL.md
      - Typed CAS Binding Design: PREPARED_BINDING_DESIGN.md
      - Upstream Scenario Ledger: UPSTREAM_TEST_LEDGER.md
      - Official Driver API Inventory: UPSTREAM_COMPATIBILITY.md
      - CI Execution Policy: CI_POLICY.md
      - Product Requirements: PRD.md
      - Translations:
          - Deutsch: README.de.md
          - हिन्दी: README.hi.md
          - Русский: README.ru.md
          - 中文: README.zh.md
      - Changelog: https://github.com/cubrid-lab/pycubrid/blob/main/CHANGELOG.md
      - Contributing: https://github.com/cubrid-lab/pycubrid/blob/main/CONTRIBUTING.md
  - 한국어:
      - 홈: ko/index.md
      - 여기서 시작:
          - "1. 처음으로 연결하기": ko/quickstart.md
          - "2. 첫 쿼리 실행하기": ko/first-query.md
          - "3. 행 저장하기": ko/save-a-row.md
          - "4. 커밋과 롤백": ko/commit-and-rollback.md
          - "5. 안전하게 마치기": ko/finish-safely.md
      - 사용:
          - 사용 예제: ko/EXAMPLES.md
      - 참고:
          - API 참조: ko/API_REFERENCE.md
          - 연결 옵션(연결 가이드): ko/CONNECTION.md
          - 값을 안전하게 전달하기(파라미터 바인딩): ko/PARAMETER_BINDING.md
          - 타입 시스템: ko/TYPES.md
          - 지원 매트릭스: ko/SUPPORT_MATRIX.md
          - "심화: CAS 아키텍처와 프로토콜": ko/CAS_OVERVIEW.md
      - 도움말:
          - 문제 해결: ko/TROUBLESHOOTING.md
          - 자주 묻는 질문: ko/faq.md
          - 버그 제보: https://github.com/cubrid-lab/pycubrid/issues/new/choose
          - 취약점 제보: https://github.com/cubrid-lab/pycubrid/blob/main/SECURITY.md
      - 운영:
          - 성능 가이드: ko/PERFORMANCE.md
      - 개발과 기여:
          - 개발 가이드: ko/DEVELOPMENT.md
          - 아키텍처: ko/ARCHITECTURE.md
          - CAS 프로토콜: ko/PROTOCOL.md
          - 타입 지정 CAS 바인딩 설계: ko/PREPARED_BINDING_DESIGN.md
          - 업스트림 시나리오 원장: ko/UPSTREAM_TEST_LEDGER.md
          - 공식 드라이버 API 목록: ko/UPSTREAM_COMPATIBILITY.md
          - CI 실행 정책: ko/CI_POLICY.md
          - 제품 요구사항: ko/PRD.md
          - 기여 가이드: CONTRIBUTING.ko.md
          - README: README.ko.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
      # Unicode-aware slugs, as GitHub renders them: the default slugifier drops
      # non-ASCII characters, which left every Korean heading without a usable id.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

exclude_docs: |
  overrides/

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore
    anchors: warn

extra:
  # The commit this site is built from (#960). GitHub Actions sets GITHUB_SHA in
  # every job, so docs.yml needs no change; a local build leaves it empty and the
  # notice says that no commit was recorded.
  source_revision: !ENV [GITHUB_SHA, ""]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cubrid-lab/pycubrid
